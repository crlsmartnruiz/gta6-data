name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Fired by data-refresh on the data branch: PRs created with GITHUB_TOKEN
  # do not trigger pull_request events (recursive-workflow prevention), so
  # the bot dispatches ci explicitly to produce the required check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run test suite
        run: |
          uv sync --all-extras
          uv run pytest
