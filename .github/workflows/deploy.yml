name: deploy
# Autonomous pipeline step 2: runs after anything lands on main (direct push
# or the data-refresh merge), validates, then applies the Ansible playbook
# to the VPS.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  workflow_run:
    workflows: [data-refresh]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    # Only deploy on successful main pushes or a successful data-refresh run
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and run test gate
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --all-extras
          uv run pytest

      - name: Check VPS configuration
        id: cfg
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VPS_HOST/VPS_SSH_KEY not set yet; skipping deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ansible and required collections
        if: steps.cfg.outputs.ready == 'true'
        run: |
          python3 -m pip install --user "ansible-core>=2.16"
          ansible-galaxy collection install community.general

      - name: Prepare SSH access
        if: steps.cfg.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/gta6_deploy_ed25519
          chmod 600 ~/.ssh/gta6_deploy_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply playbook
        if: steps.cfg.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          export ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/gta6_deploy_ed25519
          ansible-playbook ansible/playbook.yml \
            --extra-vars "git_ref=${GITHUB_SHA}" \
            --extra-vars "git_token=${{ github.token }}" \
            --extra-vars "gta6_domain=gta6data.xyz"

      - name: Smoke test production
        # Proves the deploy actually works end to end: /health must return
        # the API's JSON (the Caddy @api matcher routes it) and every
        # dataset endpoint must answer. Catches Caddy routing regressions
        # that a 200-only check would miss.
        if: steps.cfg.outputs.ready == 'true'
        run: |
          ok=""
          for i in $(seq 1 12); do
            if curl -fsS https://gta6data.xyz/health 2>/dev/null | grep -q '"status"'; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::/health did not return API JSON within 2 minutes"; exit 1; }
          for ds in vehicles locations missions prices; do
            curl -fsS "https://gta6data.xyz/api/v1/$ds?limit=1" > /dev/null \
              || { echo "::error::dataset $ds endpoint failed"; exit 1; }
          done
          echo "Smoke test passed: /health JSON + all dataset endpoints respond."
