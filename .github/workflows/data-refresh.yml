name: data-refresh
# Autonomous pipeline step 1: run scrapers in CI, open a PR with any new
# data, and merge it. The merge triggers `deploy` via workflow_run.
on:
  schedule:
    - cron: "7 * * * *"   # hourly during launch week (Nov 19-22); revert to "7 */6 * * *" after Nov 22 if data volume allows
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write  # dispatch ci on the bot's data branch (required check)

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run scrapers (exports data/*.json)
        # Per-scraper loop so failures are visible instead of masked by a
        # blanket continue-on-error. A run where every failing scraper is a
        # stub (*-stub) is the expected interim stub phase: print a notice
        # and continue. Any non-stub failure prints the list to the step
        # summary and exits 1 so the workflow goes red.
        run: |
          uv sync --all-extras
          FAIL_FILE="$RUNNER_TEMP/scraper-failures.txt"
          : > "$FAIL_FILE"
          while IFS= read -r scraper; do
            [ -z "$scraper" ] && continue
            echo "::group::scraper: $scraper"
            if uv run python scripts/run_scraper.py --name "$scraper"; then
              echo "OK: $scraper"
            else
              echo "FAILED: $scraper"
              echo "$scraper" >> "$FAIL_FILE"
            fi
            echo "::endgroup::"
          done < <(uv run python scripts/run_scraper.py --list | awk '{print $1}')

          if [ ! -s "$FAIL_FILE" ]; then
            echo "All scrapers succeeded."
            exit 0
          fi

          only_stubs=true
          {
            echo "### Scraper failures"
            echo ""
            echo "| scraper | type |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r scraper; do
            case "$scraper" in
              *-stub)
                echo "| \`$scraper\` | stub (expected in interim phase) |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                only_stubs=false
                echo "| \`$scraper\` | **non-stub (unexpected)** |" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done < "$FAIL_FILE"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$only_stubs" = true ]; then
            echo "NOTICE: every failed scraper is a stub (*-stub). Continuing: interim stub phase."
            exit 0
          fi

          echo "Non-stub scraper failures:"
          cat "$FAIL_FILE"
          exit 1

      - name: Open issue on scraper failures
        # Runs even when the scraper step exited non-zero. Issue-creation
        # failure must never block the pipeline, hence || true.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FAIL_FILE="$RUNNER_TEMP/scraper-failures.txt"
          if [ -s "$FAIL_FILE" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            BODY="Scraper failures in data-refresh run ${{ github.run_id }}:"$'\n'"$RUN_URL"$'\n'"Failed scrapers:"$'\n'"$(while IFS= read -r scraper; do echo "- \`$scraper\`"; done < "$FAIL_FILE")"
            gh issue create \
              --title "data-refresh: scraper failures ($(date -u +%Y-%m-%d))" \
              --body "$BODY" || true
          else
            echo "No scraper failures; no issue to open."
          fi

      - name: Check for data changes
        id: diff
        run: |
          # git status (not git diff) so newly created untracked data/*.json
          # files are detected too, not just modifications to tracked files.
          if [ -n "$(git status --porcelain -- data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          fi

      - name: Commit data to a refresh branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "gta6-data-bot"
          git config user.email "bot@users.noreply.github.com"
          BR="data/refresh-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BR"
          git add data/
          git commit -m "chore(data): refresh scraped datasets"
          git push origin "$BR"
          echo "branch=$BR" >> "$GITHUB_ENV"

      - name: Open PR and wait for CI, then merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "chore(data): auto-refresh datasets" \
            --body "Automated scraper run. Data diff attached to the commit. Pipeline: scrape → PR → merge → deploy."
          PR=$(gh pr list --head "$branch" --json number --jq '.[].number')
          echo "PR #$PR — dispatching ci (GITHUB_TOKEN PRs fire no pull_request events)"
          # Bot PRs don't trigger pull_request workflows; dispatch ci on the
          # data branch so the required 'tests' check exists on the head SHA.
          gh workflow run ci.yml --ref "$branch"
          echo "PR #$PR — waiting for required checks (branch protection)"
          # Wait for checks to be reported (they start async on pull_request)
          for i in $(seq 1 20); do
            OUT=$(gh pr checks "$PR" 2>&1 || true)
            echo "$OUT" | grep -q "no checks reported" || break
            sleep 15
          done
          # Block until every check concludes; exits non-zero if any fails
          gh pr checks "$PR" --watch --interval 15
          # If main moved since branch creation (strict status checks),
          # update the branch and wait for the new checks to conclude.
          gh pr update-branch "$PR" || true
          gh pr checks "$PR" --watch --interval 15 || true
          gh pr merge "$PR" --squash --delete-branch
