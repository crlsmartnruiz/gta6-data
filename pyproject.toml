[project]
name = "gta6-data"
version = "0.1.0"
description = "Community data layer for GTA VI: structured game data + free public API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gta6data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
